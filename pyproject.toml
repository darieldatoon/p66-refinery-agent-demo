[project]
name = "p66-refinery-agent-demo"
version = "0.1.0"
description = "Refinery Reliability Agent: a Managed Deep Agents demo of the LangSmith platform for Phillips 66."
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "Dariel Dato-on" }]
dependencies = [
    "deepagents>=0.7.16",
    "langchain>=1.4.2",
    "langchain-openai>=1.6.3",
    "langgraph-sdk>=0.3",
    "langsmith>=0.14.0",
    "managed-deepagents==0.8.0.dev6",
    "pydantic>=2.11",
]

[tool.mda]
python-version = "3.12"

[dependency-groups]
dev = [
    "lefthook>=2.1",
    "pytest>=9",
    "pytest-asyncio>=1.4",
    "pytest-cov>=7",
    "ruff>=0.16",
    "ty>=0.0.82",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "SIM", "RUF", "PT", "TCH", "ANN"]
ignore = ["ANN401"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ANN"]
# Prompts and judge rubrics read better as long literal strings.
"evals/*" = ["E501"]
"scripts/*" = ["E501"]

[tool.ruff.format]
docstring-code-format = true

[tool.ty.environment]
python-version = "3.12"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
markers = [
    "live: hits the gateway or a running agent server (deselect with -m 'not live')",
]
addopts = "-m 'not live' --cov --cov-report=term-missing --cov-fail-under=100"

[tool.coverage.run]
source = ["refinery_data", "tools", "subagents", "models", "agent", "middleware"]
branch = true
omit = ["scripts/*", "evals/*"]

[tool.coverage.report]
fail_under = 100
show_missing = true
exclude_also = ["if TYPE_CHECKING:", "@overload"]

[tool.uv]
prerelease = "if-necessary"
